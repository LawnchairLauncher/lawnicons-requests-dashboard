name: Prune Requests

on:
  schedule:
    - cron: '17 1 * * *'
      timezone: Europe/Moscow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests google-play-scraper lxml Pillow

      - name: Prune requests
        id: prune_requests
        run: python scripts/prune_requests.py

      - name: Auto generate tags
        if: steps.prune_requests.outputs.appfilter_changed == 'true'
        run: python scripts/generate_auto_tags.py src/assets/requests.json src/assets/filters src/assets/appfilter.xml

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Prune fulfilled and outdated requests" && git push)