name: Prune Requests

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests google-play-scraper lxml

      - name: Clean emails
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONUNBUFFERED: 1
        run: python scripts/clean_emails.py
        timeout-minutes: 15

      - name: Fetch new emails
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONUNBUFFERED: 1
        run: python scripts/fetch_emails.py
        timeout-minutes: 30

      - name: Parse emails
        run: |
          if [ "$(ls -A emails/ 2>/dev/null)" ]; then
            python scripts/email_parser.py emails/ src/assets/appfilter.xml src/extracted_png src/assets
          else
            echo "No emails to parse."
          fi

      - name: Cleanup emails
        run: rm -rf emails/

      - name: Save trending baseline
        run: python scripts/save_trending_baseline.py

      - name: Prune requests
        id: prune_requests
        run: python scripts/prune_requests.py

      - name: Auto generate tags
        if: steps.prune_requests.outputs.appfilter_changed == 'true'
        run: python scripts/generate_auto_tags.py src/assets/requests.json src/assets/filters src/assets/appfilter.xml

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Prune fulfilled and outdated requests" && git push)